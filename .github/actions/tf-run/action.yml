name: Terraform Run
description: Setup Terraform and run validate or plan for a given directory.
inputs:
  working-directory:
    description: Relative path to the Terraform configuration directory
    required: true
  command:
    description: "validate | plan | apply | plan-apply"
    required: true
  terraform-version:
    description: Terraform CLI version to install
    required: false
    default: "1.9.8"
  global-vars-file:
    description: Path to global variables file (e.g., ./global-variables.tfvars)
    required: false
    default: ""
  step-vars-file:
    description: Path to step-specific variables file (e.g., ./step/step-variables.tfvars)
    required: false
    default: ""
  backend-bucket:
    description: S3 bucket name for Terraform state (AWS_BACKEND_BUCKET repo variable)
    required: false
    default: ""
  backend-region:
    description: AWS region of the state bucket (AWS_BACKEND_REGION repo variable)
    required: false
    default: ""
  depends-on-step:
    description: SSM path of the previous step's marker; plan is skipped if the parameter is absent
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check step dependency
      id: dep-check
      if: ${{ inputs.command == 'plan' && inputs.depends-on-step != '' }}
      shell: bash
      run: |
        if aws ssm get-parameter --name "${{ inputs.depends-on-step }}" &>/dev/null; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Prerequisite '${{ inputs.depends-on-step }}' not yet in SSM — skipping plan."
        fi
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Init (no backend)
      if: ${{ inputs.command == 'validate' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -backend=false

    - name: Format check
      if: ${{ inputs.command == 'validate' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    - name: Validate
      if: ${{ inputs.command == 'validate' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate

    - name: Generate backend config
      if: ${{ (inputs.command == 'plan' || inputs.command == 'apply' || inputs.command == 'plan-apply') && steps.dep-check.outputs.ready != 'false' }}
      shell: bash
      run: printf 'bucket = "%s"\nregion = "%s"\n' "${{ inputs.backend-bucket }}" "${{ inputs.backend-region }}" > backend.hcl

    - name: Init
      if: ${{ (inputs.command == 'plan' || inputs.command == 'apply' || inputs.command == 'plan-apply') && steps.dep-check.outputs.ready != 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -backend-config=../backend.hcl

    - name: Plan
      if: ${{ inputs.command == 'plan' && steps.dep-check.outputs.ready != 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        plan_args="-detailed-exitcode"
        [[ -n "${{ inputs.global-vars-file }}" ]] && plan_args="$plan_args -var-file=${{ inputs.global-vars-file }}"
        [[ -n "${{ inputs.step-vars-file }}" ]] && plan_args="$plan_args -var-file=${{ inputs.step-vars-file }}"
        set +e
        terraform plan $plan_args
        exit_code=$?
        set -e
        # exit code 2 = changes present (not an error)
        [ "$exit_code" -ne 1 ]

    - name: Plan
      if: ${{ inputs.command == 'plan-apply' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        plan_args="-out=tfplan"
        [[ -n "${{ inputs.global-vars-file }}" ]] && plan_args="$plan_args -var-file=${{ inputs.global-vars-file }}"
        [[ -n "${{ inputs.step-vars-file }}" ]] && plan_args="$plan_args -var-file=${{ inputs.step-vars-file }}"
        terraform plan $plan_args

    - name: Apply
      if: ${{ inputs.command == 'apply' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        apply_args="-auto-approve"
        [[ -n "${{ inputs.global-vars-file }}" ]] && apply_args="$apply_args -var-file=${{ inputs.global-vars-file }}"
        [[ -n "${{ inputs.step-vars-file }}" ]] && apply_args="$apply_args -var-file=${{ inputs.step-vars-file }}"
        terraform apply $apply_args

    - name: Apply
      if: ${{ inputs.command == 'plan-apply' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform apply -auto-approve tfplan
