          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
          backend-bucket: ${{ vars.AWS_BACKEND_BUCKET }}
