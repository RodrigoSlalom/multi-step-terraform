name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/deploy.yml"
      - ".github/actions/tf-run/**"
      - "global-variables.tfvars"
      - "*/step-variables.tfvars"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Step 01: Organization Setup (independent)
  plan-org:
    name: Plan / 01-organization-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-org:
    name: Apply / 01-organization-setup
    needs: plan-org
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 02: Control Tower (depends on 01)
  plan-ct:
    name: Plan / 02-control-tower-setup
    needs: apply-org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-ct:
    name: Apply / 02-control-tower-setup
    needs: plan-ct
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 03: Security Tooling (depends on 02)
  plan-security:
    name: Plan / 03-security-tooling
    needs: apply-ct
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 03-security-tooling
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-security:
    name: Apply / 03-security-tooling
    needs: plan-security
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 03-security-tooling
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 04: Organizational Policies (depends on 01, can run in parallel with 05)
  plan-policies:
    name: Plan / 04-organizational-policies
    needs: apply-org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 04-organizational-policies
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-policies:
    name: Apply / 04-organizational-policies
    needs: plan-policies
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 04-organizational-policies
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 05: Identity Center (depends on 01, can run in parallel with 04)
  plan-identity:
    name: Plan / 05-identity-center
    needs: apply-org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 05-identity-center
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-identity:
    name: Apply / 05-identity-center
    needs: plan-identity
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 05-identity-center
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 06: AFT Setup (depends on 02 AND 05)
  plan-aft:
    name: Plan / 06-aft-setup
    needs: [apply-ct, apply-identity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 06-aft-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-aft:
    name: Apply / 06-aft-setup
    needs: plan-aft
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 06-aft-setup
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 07: Networking (depends on 06)
  plan-networking:
    name: Plan / 07-networking-rollout
    needs: apply-aft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 07-networking-rollout
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-networking:
    name: Apply / 07-networking-rollout
    needs: plan-networking
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 07-networking-rollout
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  # Step 08: Cost Governance (depends on 01 AND 07)
  plan-cost:
    name: Plan / 08-cost-governance
    needs: [apply-org, apply-networking]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 08-cost-governance
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  apply-cost:
    name: Apply / 08-cost-governance
    needs: plan-cost
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 08-cost-governance
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
