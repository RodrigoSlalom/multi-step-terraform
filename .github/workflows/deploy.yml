name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/deploy.yml"
      - ".github/actions/tf-run/**"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add your cloud provider OIDC step here when switching to remote state, e.g.:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@<sha> # vX.Y.Z
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v4.0.1
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - name: Plan and apply all steps
        run: |
          for dir in $(find . -maxdepth 1 -type d -name '[0-9][0-9]-*' | sort); do
            step=$(basename "$dir")

            echo "::group::$step - init"
            terraform -chdir="$dir" init
            echo "::endgroup::"

            echo "::group::$step - plan"
            set +e
            terraform -chdir="$dir" plan -detailed-exitcode -out=tfplan
            plan_exit=$?
            set -e
            if [ "$plan_exit" -eq 1 ]; then
              echo "::error::Plan failed for $step"
              exit 1
            fi
            echo "::endgroup::"

            echo "::group::$step - apply"
            terraform -chdir="$dir" apply -auto-approve tfplan
            echo "::endgroup::"
          done
