name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/deploy.yml"
      - ".github/actions/tf-run/**"
      - "global-variables.tfvars"
      - "*/step-variables.tfvars"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-org:
    name: Plan / 01-organization-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
          backend-bucket: ${{ vars.AWS_BACKEND_BUCKET }}
          backend-region: ${{ vars.AWS_BACKEND_REGION }}

  apply-org:
    name: Apply / 01-organization-setup
    needs: plan-org
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
          backend-bucket: ${{ vars.AWS_BACKEND_BUCKET }}
          backend-region: ${{ vars.AWS_BACKEND_REGION }}

  plan-ct:
    name: Plan / 02-control-tower-setup
    needs: apply-org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
          backend-bucket: ${{ vars.AWS_BACKEND_BUCKET }}
          backend-region: ${{ vars.AWS_BACKEND_REGION }}

  apply-ct:
    name: Apply / 02-control-tower-setup
    needs: plan-ct
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
