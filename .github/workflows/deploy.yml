name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/deploy.yml"
      - ".github/actions/tf-run/**"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-step-01:
    name: Plan / 01-step-one
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add your cloud provider OIDC step here when switching to remote state

      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-step-one
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  apply-step-01:
    name: Apply / 01-step-one
    needs: plan-step-01
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add your cloud provider OIDC step here when switching to remote state

      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-step-one
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  plan-step-02:
    name: Plan / 02-step-two
    needs: apply-step-01
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add your cloud provider OIDC step here when switching to remote state

      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-step-two
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  apply-step-02:
    name: Apply / 02-step-two
    needs: plan-step-02
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add your cloud provider OIDC step here when switching to remote state

      - name: Apply
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-step-two
          command: apply
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
