name: PR Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/pr-validate.yml"
      - ".github/actions/tf-run/**"

concurrency:
  group: pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover steps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      steps: ${{ steps.find.outputs.steps }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find step directories
        id: find
        run: |
          steps=$(find . -maxdepth 1 -type d -name '[0-9][0-9]-*' | sort | \
            jq -R -s -c '[split("\n") | .[] | select(length > 0) | ltrimstr("./")]')
          echo "steps=$steps" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate / ${{ matrix.step }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        step: ${{ fromJson(needs.discover.outputs.steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: ${{ matrix.step }}
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  plan:
    name: Plan / ${{ matrix.step }}
    needs: [discover, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        step: ${{ fromJson(needs.discover.outputs.steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: ${{ matrix.step }}
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
