name: PR Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/pr-validate.yml"
      - ".github/actions/tf-run/**"

concurrency:
  group: pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-step-01:
    name: Validate / 01-step-one
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-step-one
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-step-02:
    name: Validate / 02-step-two
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-step-two
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  plan-step-01:
    name: Plan / 01-step-one
    needs: validate-step-01
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-step-one
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  plan-step-02:
    name: Plan / 02-step-two
    needs: validate-step-02
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-step-two
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
