name: PR Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/pr-validate.yml"
      - ".github/actions/tf-run/**"
      - "global-variables.tfvars"
      - "*/step-variables.tfvars"

concurrency:
  group: pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-org:
    name: Validate / 01-organization-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-ct:
    name: Validate / 02-control-tower-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-security:
    name: Validate / 03-security-tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 03-security-tooling
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-policies:
    name: Validate / 04-organizational-policies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 04-organizational-policies
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-identity:
    name: Validate / 05-identity-center
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 05-identity-center
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-aft:
    name: Validate / 06-aft-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 06-aft-setup
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-networking:
    name: Validate / 07-networking-rollout
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 07-networking-rollout
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  validate-cost:
    name: Validate / 08-cost-governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        uses: ./.github/actions/tf-run
        with:
          working-directory: 08-cost-governance
          command: validate
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}

  plan-org:
    name: Plan / 01-organization-setup
    needs: validate-org
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 01-organization-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-ct:
    name: Plan / 02-control-tower-setup
    needs: validate-ct
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 02-control-tower-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-security:
    name: Plan / 03-security-tooling
    needs: validate-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 03-security-tooling
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-policies:
    name: Plan / 04-organizational-policies
    needs: validate-policies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 04-organizational-policies
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-identity:
    name: Plan / 05-identity-center
    needs: validate-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 05-identity-center
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-aft:
    name: Plan / 06-aft-setup
    needs: validate-aft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 06-aft-setup
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-networking:
    name: Plan / 07-networking-rollout
    needs: validate-networking
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 07-networking-rollout
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars

  plan-cost:
    name: Plan / 08-cost-governance
    needs: validate-cost
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan
        uses: ./.github/actions/tf-run
        with:
          working-directory: 08-cost-governance
          command: plan
          terraform-version: ${{ vars.TF_VERSION || '1.9.8' }}
          global-vars-file: ../global-variables.tfvars
          step-vars-file: step-variables.tfvars
